name: native

on:
  push:
    paths:
      - "native/**"
      - "setup.ps1"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "setup.ps1"
  workflow_dispatch:

jobs:
  # The DSP has no JUCE in it, so it can be checked properly on Linux under
  # sanitisers MSVC does not offer. This is where hot-swap correctness is
  # actually proven: 20k model swaps against a live audio thread, plus the
  # whole chain run against the real .nam files NeuralAudio ships.
  engine:
    name: engine + sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install audio build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Build and test
        working-directory: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGOOTAR_BUILD_APP=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: ThreadSanitizer
        working-directory: native
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGOOTAR_BUILD_APP=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --parallel
          ./build-tsan/gootar_model_swapper_test
          ./build-tsan/gootar_engine_test

      - name: AddressSanitizer + UBSan
        working-directory: native
        # Leak detection stays ON. asan.supp suppresses exactly one known
        # upstream leak by name (NeuralAudio's one-time model-definition
        # registration), so the check keeps its teeth for our own code.
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/native/asan.supp
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGOOTAR_BUILD_APP=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel
          ./build-asan/gootar_model_swapper_test
          ./build-asan/gootar_engine_test

  # setup.ps1 is the first thing a fresh machine runs. A syntax error there is
  # a completely broken install, so it gets parsed on every change.
  setup-script:
    name: setup script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse setup.ps1
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host "line $($e.Extent.StartLineNumber): $($e.Message)"
            }
            exit 1
          }
          Write-Host "setup.ps1 parses cleanly"

      - name: Detection runs without error
        shell: pwsh
        # -SkipInstall exercises tool detection and the early-exit path without
        # installing several GB on a CI runner.
        run: ./setup.ps1 -SkipInstall; if ($LASTEXITCODE -gt 1) { exit 1 }

  # Produces the binaries to actually download and play through. This exists
  # because the machine this project is developed on has no compiler.
  windows:
    name: windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ASIO needs Steinberg's SDK, a separate download that is not committed
      # here. When it is absent the build still produces a working WASAPI
      # standalone - enough to confirm the DSP, not enough to play through.
      # To get ASIO: drop the SDK in native/libs/asiosdk and flip this on.
      #
      # The generator is deliberately NOT pinned. Naming a specific Visual
      # Studio ("Visual Studio 17 2022") breaks the moment the runner image
      # ships a newer one - which is exactly what happened. CMake picks the
      # newest Visual Studio actually installed, so this keeps working as the
      # image moves; -A x64 still applies, since every Windows runner has some
      # Visual Studio and therefore a VS generator.
      - name: Configure
        run: >
          cmake -S native -B native/build
          -A x64
          -DGOOTAR_ENABLE_ASIO=OFF

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Test
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gootar-windows-x64
          path: |
            native/build/GootarPlayer_artefacts/Release/Standalone/*.exe
            native/build/GootarPlayer_artefacts/Release/VST3/**
          if-no-files-found: warn
          retention-days: 30
